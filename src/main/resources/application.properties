spring.application.name=jambu-api
spring.datasource.url=${JAMBU_DB_URL:jdbc:postgresql://localhost:5432/jambu}
spring.datasource.username=${JAMBU_DB_USER}
spring.datasource.password=${JAMBU_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.flyway.enabled=true
# O único repeatable legado era o seed manual de desenvolvimento, agora aposentado.
# Migrações versionadas continuam submetidas à validação normal de checksum/presença.
spring.flyway.ignore-migration-patterns=repeatable:missing,*:future
spring.jackson.deserialization.fail-on-unknown-properties=true
server.address=${JAMBU_BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
jambu.limite-dishes=${JAMBU_LIMITE_DISHES:20}
jambu.limite-review=${JAMBU_LIMITE_REVIEW:2000}
jambu.limite-autenticacao-minuto=20
jambu.auth.duracao-acesso=${JAMBU_AUTH_DURACAO_ACESSO:PT15M}
jambu.auth.inatividade=${JAMBU_AUTH_INATIVIDADE:P30D}
jambu.auth.limite-absoluto=${JAMBU_AUTH_LIMITE_ABSOLUTO:P180D}
jambu.auth.janela-repeticao=PT30S
jambu.auth.autenticacao-recente=PT10M
jambu.auth.chave-repeticao=${JAMBU_AUTH_CHAVE_REPETICAO:}
jambu.auth.origem-web=${JAMBU_AUTH_ORIGEM_WEB:}
jambu.auth.cookie-seguro=${JAMBU_AUTH_COOKIE_SEGURO:true}
jambu.auth.limite-refresh-minuto=60
jambu.auth.limite-reautenticacao-minuto=5
jambu.url-compartilhamento=${JAMBU_URL_COMPARTILHAMENTO:http://localhost:8080/api/meals/}
jambu.places.habilitado=${JAMBU_GOOGLE_PLACES_HABILITADO:false}
jambu.places.api-key=${JAMBU_GOOGLE_PLACES_API_KEY:}
jambu.places.base-url=${JAMBU_GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1/}
jambu.places.timeout=${JAMBU_GOOGLE_PLACES_TIMEOUT:PT3S}
jambu.places.tipos-aceitos=restaurant,cafe,bakery,bar,meal_takeaway,meal_delivery
jambu.restaurantes.limite-google-dia=${JAMBU_GOOGLE_PLACES_LIMITE_DIA:300}
jambu.restaurantes.raio-duplicata-metros=300
jambu.restaurantes.similaridade-minima=0.45
jambu.restaurantes.revisores=${JAMBU_REVISORES_RESTAURANTES:}
jambu.restaurantes.areas=${JAMBU_AREAS_CATALOGO:grande-sao-luis}
jambu.restaurantes.limite-cadastros-dia=${JAMBU_LIMITE_CADASTROS_DIA:5}
jambu.restaurantes.limite-buscas-ampliadas-dia=${JAMBU_LIMITE_BUSCAS_AMPLIADAS_DIA:30}
jambu.restaurantes.casamento-overture=${JAMBU_CASAMENTO_OVERTURE:false}
jambu.restaurantes.candidatos-casamento=${JAMBU_CANDIDATOS_CASAMENTO:3}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
jambu.fotos.diretorio-local=${JAMBU_FOTOS_DIRETORIO_LOCAL:.local/storage-fotos}
jambu.fotos.storage-tipo=${JAMBU_FOTOS_STORAGE_TIPO:local}
jambu.fotos.supabase-url=${JAMBU_FOTOS_SUPABASE_URL:}
jambu.fotos.supabase-key=${JAMBU_FOTOS_SUPABASE_KEY:}
jambu.fotos.supabase-bucket=${JAMBU_FOTOS_SUPABASE_BUCKET:jambu-fotos-privadas}
jambu.fotos.moderacao-habilitada=${JAMBU_FOTOS_MODERACAO_HABILITADA:false}
jambu.fotos.moderacao-provedor=${JAMBU_FOTOS_MODERACAO_PROVEDOR:rekognition}
jambu.fotos.moderacao-base-url=${JAMBU_FOTOS_MODERACAO_BASE_URL:https://rekognition.us-east-1.amazonaws.com/}
jambu.fotos.moderacao-api-key=${JAMBU_FOTOS_MODERACAO_API_KEY:}
jambu.fotos.moderacao-timeout=${JAMBU_FOTOS_MODERACAO_TIMEOUT:PT5S}
jambu.fotos.versao-politica=${JAMBU_FOTOS_VERSAO_POLITICA:2026-10-v1}
jambu.fotos.limiar-rejeicao=${JAMBU_FOTOS_LIMIAR_REJEICAO:80.0}
jambu.fotos.limiar-revisao=${JAMBU_FOTOS_LIMIAR_REVISAO:40.0}
jambu.fotos.max-tentativas-moderacao=${JAMBU_FOTOS_MAX_TENTATIVAS:3}
jambu.fotos.atraso-base-moderacao=${JAMBU_FOTOS_ATRASO_BASE_MODERACAO:PT10S}
jambu.fotos.duracao-reserva-moderacao=${JAMBU_FOTOS_DURACAO_RESERVA_MODERACAO:PT60S}
jambu.fotos.lote-moderacao=${JAMBU_FOTOS_LOTE_MODERACAO:10}
jambu.fotos.agendador-moderacao-habilitado=${JAMBU_FOTOS_AGENDADOR_MODERACAO_HABILITADO:true}
jambu.fotos.retencao-rejeitadas=${JAMBU_FOTOS_RETENCAO_REJEITADAS:P7D}
jambu.fotos.teto-principal-bytes=1048576
jambu.fotos.teto-miniatura-bytes=204800
jambu.fotos.moderadores=${JAMBU_MODERADORES_USERNAMES:}
