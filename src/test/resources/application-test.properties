# Banco descartável obrigatório; nunca reutilizar silenciosamente o banco de desenvolvimento.
spring.datasource.url=${JAMBU_TEST_DB_URL}
spring.datasource.username=${JAMBU_TEST_DB_USER}
spring.datasource.password=${JAMBU_TEST_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
logging.level.root=WARN
# Exclusiva dos testes em banco descartável; nunca usar fora deste perfil.
jambu.auth.chave-repeticao=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# Relógios dos testes avançam meses; a limpeza é chamada explicitamente no cenário.
jambu.auth.limpeza-intervalo-ms=3600000
logging.level.org.hibernate.orm.jdbc.error=OFF
jambu.places.habilitado=false
jambu.places.api-key=
jambu.fotos.diretorio-local=${java.io.tmpdir}/jambu-fotos-test-${random.uuid}
jambu.fotos.storage-tipo=local
jambu.fotos.moderacao-habilitada=true
jambu.fotos.moderacao-api-key=
jambu.fotos.agendador-moderacao-habilitado=false
jambu.fotos.atraso-base-moderacao=PT1S
jambu.fotos.duracao-reserva-moderacao=PT30S
jambu.fotos.moderadores=admin_moderador
